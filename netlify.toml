# Netlify build settings. The app is the static site in frontend/; /api/* goes to the API server on Render.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The API server on Render, under the same address as the app (so the sign-in cookie stays on
# this site). Must come before the single-page-app rule below. If Render gives the service
# another address, change it here.
[[redirects]]
  from = "/api/*"
  to = "https://melantha-guitar-api.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: every address (e.g. /songs/abc/practice) loads index.html and React shows the page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
