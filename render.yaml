# Render blueprint for the API server (free plan). The database is on Neon: paste its
# connection string as DATABASE_URL when Render asks.
services:
  - type: web
    name: melantha-guitar-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Applies any new database changes, then starts the server.
    startCommand: alembic upgrade head && python -m app.cli seed-songs && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # Password reset emails (Brevo, free: 300 a day). Links in emails point to the website.
      - key: APP_URL
        value: https://melantha-guitar-academy.netlify.app
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Dataset collector (admin only): the recorded plucks' audio in a private Backblaze B2
      # bucket (free 10 GB, no card). See docs/ARCHITECTURE.md, "Dataset collector".
      - key: DATASET_STORAGE
        value: s3
      - key: DATASET_S3_ENDPOINT
        sync: false
      - key: DATASET_S3_REGION
        sync: false
      - key: DATASET_S3_BUCKET
        sync: false
      - key: DATASET_S3_KEY_ID
        sync: false
      - key: DATASET_S3_SECRET
        sync: false
